baseURL = "https://reef-pi.github.io/"
DefaultContentLanguage = "en-us"
theme = "hugo-sustain"
googleAnalytics = "UA-102968086-1"

[params]
Author = "Ranjib Dey"
Description = "reef-pi - An opensource reef tank controller based on Raspberry Pi"
custom_css = ["css/img.css"]

[params.social]
  Github    = "reef-pi"
  Email     = "info@reef-pi.com"
  Twitter   = "reef_pi"
  
[languages]
  [languages.en-us]
    weight = 1
    LanguageName = "English"

    title = "reef-pi - An opensource reef tank controller based on Raspberry Pi"

    [languages.en-us.menus]
      [[languages.en-us.menus.main]]
        name = "guides"
        identifier = "guides"
        weight = 50
        pageRef = '/guides'

      [[languages.en-us.menus.main]]
        name = "additional documentation"
        identifier = "additional documentation"
        weight = 100
        pageRef = '/additional-documentation'

  [languages.es-es]
    weight = 2
    LanguageName = "Español"
    title = "reef-pi - Un controlador para acuario marino basado en Raspberry Pi"

  [languages.es-es.menus]
    [[languages.es-es.menus.main]]
      name = "Guias"
      identifier = "guides"
      weight = 50
      pageRef = '/guides'

    [[languages.es-es.menus.main]]
      name = "Documentación adicional"
      identifier = "additional documentation"
      weight = 100
      pageRef = '/additional-documentation'